  <text x="760" y="154" text-anchor="middle" fill="#f0f6fc" font-size="12" font-weight="600">Azure Databricks</text>
  <text x="760" y="170" text-anchor="middle" fill="#8b949e" font-size="10">PySpark Notebooks</text>

  <!-- Power BI -->
  <rect x="680" y="208" width="160" height="100" rx="8" fill="#0e1a2a" stroke="#f2c811" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="760" y="248" text-anchor="middle" fill="#f2c811" font-size="26">📊</text>
  <text x="760" y="270" text-anchor="middle" fill="#f0f6fc" font-size="12" font-weight="600">Power BI</text>
  <text x="760" y="286" text-anchor="middle" fill="#8b949e" font-size="10">Interactive Dashboard</text>

  <!-- ═══ ARROWS ═══ -->
  <!-- Sources → ADF -->
  <line x1="190" y1="118" x2="238" y2="160" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <line x1="190" y1="198" x2="238" y2="198" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <line x1="190" y1="278" x2="238" y2="238" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>

  <!-- ADF → ADLS -->
  <line x1="420" y1="198" x2="478" y2="198" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ADLS Silver → Databricks -->
  <line x1="660" y1="220" x2="678" y2="180" stroke="#a8a9ad" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>

  <!-- Databricks → Gold -->
  <line x1="680" y1="145" x2="646" y2="270" stroke="#ff3621" stroke-width="1.5" marker-end="url(#arrowGold)" stroke-dasharray="4,3"/>

  <!-- Gold → Power BI -->
  <line x1="660" y1="272" x2="678" y2="258" stroke="#ffd700" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- ═══ KPI SECTION ═══ -->
  <rect x="30" y="340" width="920" height="110" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="500" y="365" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="2">POWER BI KPIs &amp; INSIGHTS</text>

  <!-- KPI cards -->
  <rect x="50" y="376" width="180" height="56" rx="8" fill="#0d2137" stroke="#0078d4" stroke-width="1"/>
  <text x="140" y="400" text-anchor="middle" fill="#79c0ff" font-size="18" font-weight="700">💰</text>
  <text x="140" y="418" text-anchor="middle" fill="#f0f6fc" font-size="11" font-weight="600">Total Revenue</text>
  <text x="140" y="430" text-anchor="middle" fill="#8b949e" font-size="9">SUM(consultation_fee)</text>

  <rect x="250" y="376" width="180" height="56" rx="8" fill="#0f2d1a" stroke="#2ea043" stroke-width="1"/>
  <text x="340" y="400" text-anchor="middle" fill="#56d364" font-size="18" font-weight="700">📅</text>
  <text x="340" y="418" text-anchor="middle" fill="#f0f6fc" font-size="11" font-weight="600">Total Appointments</text>
  <text x="340" y="430" text-anchor="middle" fill="#8b949e" font-size="9">COUNT(appointment_id)</text>

  <rect x="450" y="376" width="180" height="56" rx="8" fill="#1a1500" stroke="#ffd700" stroke-width="1"/>
  <text x="540" y="400" text-anchor="middle" fill="#ffd700" font-size="18" font-weight="700">✅</text>
  <text x="540" y="418" text-anchor="middle" fill="#f0f6fc" font-size="11" font-weight="600">Completed Appts</text>
  <text x="540" y="430" text-anchor="middle" fill="#8b949e" font-size="9">status = "Completed"</text>

  <rect x="650" y="376" width="180" height="56" rx="8" fill="#1b1030" stroke="#ff3621" stroke-width="1"/>
  <text x="740" y="400" text-anchor="middle" fill="#ff3621" font-size="18" font-weight="700">📈</text>
  <text x="740" y="418" text-anchor="middle" fill="#f0f6fc" font-size="11" font-weight="600">Avg Consultation Fee</text>
  <text x="740" y="430" text-anchor="middle" fill="#8b949e" font-size="9">AVERAGE(consultation_fee)</text>

  <!-- ═══ DATASETS SECTION ═══ -->
  <rect x="30" y="468" width="920" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="500" y="490" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="2">DATASETS USED</text>

  <rect x="95" y="500" width="150" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="170" y="518" text-anchor="middle" fill="#f0f6fc" font-size="10" font-weight="600">Patients.xlsx</text>
  <text x="170" y="534" text-anchor="middle" fill="#8b949e" font-size="9">Healthcare</text>

  <rect x="265" y="500" width="150" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="340" y="518" text-anchor="middle" fill="#f0f6fc" font-size="10" font-weight="600">Doctors.xlsx</text>
  <text x="340" y="534" text-anchor="middle" fill="#8b949e" font-size="9">Healthcare</text>

  <rect x="435" y="500" width="150" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="510" y="518" text-anchor="middle" fill="#f0f6fc" font-size="10" font-weight="600">Appointments.xlsx</text>
  <text x="510" y="534" text-anchor="middle" fill="#8b949e" font-size="9">Healthcare</text>

  <rect x="605" y="500" width="150" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="680" y="518" text-anchor="middle" fill="#f0f6fc" font-size="10" font-weight="600">inventory.xlsx</text>
  <text x="680" y="534" text-anchor="middle" fill="#8b949e" font-size="9">Inventory</text>

  <!-- ═══ TECH BADGES ═══ -->
  <rect x="30" y="574" width="920" height="88" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="500" y="594" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="2">TECH STACK</text>

  <rect x="48" y="604" width="130" height="44" rx="20" fill="#0d2137" stroke="#0078d4" stroke-width="1.5"/>
  <text x="113" y="631" text-anchor="middle" fill="#79c0ff" font-size="11" font-weight="600">Azure Data Factory</text>

  <rect x="190" y="604" width="130" height="44" rx="20" fill="#0f1a10" stroke="#107c10" stroke-width="1.5"/>
  <text x="255" y="631" text-anchor="middle" fill="#56d364" font-size="11" font-weight="600">ADLS Gen2</text>

  <rect x="332" y="604" width="130" height="44" rx="20" fill="#1b1030" stroke="#ff3621" stroke-width="1.5"/>
  <text x="397" y="631" text-anchor="middle" fill="#ff8c70" font-size="11" font-weight="600">Azure Databricks</text>

  <rect x="474" y="604" width="130" height="44" rx="20" fill="#0d2137" stroke="#0078d4" stroke-width="1.5"/>
  <text x="539" y="631" text-anchor="middle" fill="#79c0ff" font-size="11" font-weight="600">Azure SQL DB</text>

  <rect x="616" y="604" width="130" height="44" rx="20" fill="#0e1a2a" stroke="#f2c811" stroke-width="1.5"/>
  <text x="681" y="631" text-anchor="middle" fill="#f2c811" font-size="11" font-weight="600">Power BI</text>

  <rect x="758" y="604" width="130" height="44" rx="20" fill="#1a1400" stroke="#ffa500" stroke-width="1.5"/>
  <text x="823" y="631" text-anchor="middle" fill="#ffa500" font-size="11" font-weight="600">Delta Lake</text>
</svg>
