<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005a9e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cd7f32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5e21;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8a9ad;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6e7074;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#107c10;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b5c0b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff" />
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffd700" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#f0f6fc" font-size="18" font-weight="700" letter-spacing="1">Azure ETL Pipeline — Medallion Architecture</text>
  <line x1="200" y1="48" x2="800" y2="48" stroke="#30363d" stroke-width="1"/>

  <!-- ═══ DATA SOURCES COLUMN ═══ -->
  <text x="110" y="78" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="2">DATA SOURCES</text>

  <!-- GitHub -->
  <rect x="30" y="88" width="160" height="60" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="58" y="114" fill="#58a6ff" font-size="20">⬡</text>
  <text x="80" y="112" fill="#f0f6fc" font-size="12" font-weight="600">GitHub</text>
  <text x="80" y="128" fill="#8b949e" font-size="10">CSV / JSON files</text>

  <!-- Excel / Blob -->
  <rect x="30" y="168" width="160" height="60" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="58" y="194" fill="#21a366" font-size="20">⬡</text>
  <text x="80" y="192" fill="#f0f6fc" font-size="12" font-weight="600">Excel / Blob</text>
  <text x="80" y="208" fill="#8b949e" font-size="10">.xlsx, .csv</text>

  <!-- SQL Server -->
  <rect x="30" y="248" width="160" height="60" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="58" y="274" fill="#0078d4" font-size="20">⬡</text>
  <text x="80" y="272" fill="#f0f6fc" font-size="12" font-weight="600">Azure SQL DB</text>
  <text x="80" y="288" fill="#8b949e" font-size="10">OLTP source</text>

  <!-- ═══ ADF COLUMN ═══ -->
  <text x="330" y="78" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="2">ORCHESTRATION</text>

  <!-- ADF Box -->
  <rect x="240" y="88" width="180" height="220" rx="10" fill="#0d2137" stroke="#0078d4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="240" y="88" width="180" height="36" rx="10" fill="url(#blueGrad)"/>
  <rect x="240" y="110" width="180" height="14" fill="#0d2137"/>
  <text x="330" y="112" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Azure Data Factory</text>

  <rect x="256" y="138" width="148" height="36" rx="6" fill="#0f2d4a" stroke="#0078d4" stroke-width="1"/>
  <text x="330" y="152" text-anchor="middle" fill="#79c0ff" font-size="10" font-weight="600">GitHub Pipeline</text>
  <text x="330" y="166" text-anchor="middle" fill="#8b949e" font-size="9">Web Activity → ForEach → Copy</text>

  <rect x="256" y="184" width="148" height="36" rx="6" fill="#0f2d4a" stroke="#0078d4" stroke-width="1"/>
  <text x="330" y="198" text-anchor="middle" fill="#79c0ff" font-size="10" font-weight="600">Blob to Blob Pipeline</text>
  <text x="330" y="212" text-anchor="middle" fill="#8b949e" font-size="9">Filter → Join → Aggregate</text>

  <rect x="256" y="230" width="148" height="36" rx="6" fill="#0f2d4a" stroke="#0078d4" stroke-width="1"/>
  <text x="330" y="244" text-anchor="middle" fill="#79c0ff" font-size="10" font-weight="600">SQL Upsert Pipeline</text>
  <text x="330" y="258" text-anchor="middle" fill="#8b949e" font-size="9">Incremental Load (Watermark)</text>

  <rect x="256" y="276" width="148" height="22" rx="6" fill="#0f2d4a" stroke="#0078d4" stroke-width="1"/>
  <text x="330" y="291" text-anchor="middle" fill="#79c0ff" font-size="10" font-weight="600">Data Flows &amp; Linked Services</text>

  <!-- ═══ ADLS / MEDALLION COLUMN ═══ -->
  <text x="570" y="78" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600" letter-spacing="2">MEDALLION LAYERS</text>

  <!-- ADLS wrapper -->
  <rect x="480" y="88" width="180" height="220" rx="10" fill="#0f1a10" stroke="#107c10" stroke-width="2" filter="url(#shadow)"/>
  <rect x="480" y="88" width="180" height="36" rx="10" fill="url(#greenGrad)"/>
  <rect x="480" y="110" width="180" height="14" fill="#0f1a10"/>
  <text x="570" y="112" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">ADLS Gen2</text>

  <!-- Bronze -->
  <rect x="496" y="138" width="148" height="48" rx="6" fill="#2a1a08" stroke="#cd7f32" stroke-width="1.5"/>
  <text x="570" y="156" text-anchor="middle" fill="#cd7f32" font-size="11" font-weight="700">🥉 BRONZE</text>
  <text x="570" y="172" text-anchor="middle" fill="#8b949e" font-size="9">Raw ingestion — Parquet</text>

  <!-- Silver -->
  <rect x="496" y="196" width="148" height="48" rx="6" fill="#1a1a1a" stroke="#a8a9ad" stroke-width="1.5"/>
  <text x="570" y="214" text-anchor="middle" fill="#c0c0c0" font-size="11" font-weight="700">🥈 SILVER</text>
  <text x="570" y="230" text-anchor="middle" fill="#8b949e" font-size="9">Cleaned &amp; transformed</text>

  <!-- Gold -->
  <rect x="496" y="254" width="148" height="44" rx="6" fill="#1a1500" stroke="#ffd700" stroke-width="1.5"/>
  <text x="570" y="272" text-anchor="middle" fill="#ffd700" font-size="11" font-weight="700">🥇 GOLD</text>
  <text x="570" y="288" text-anchor="middle" fill="#8b949e" font-size="9">Business-ready Delta Tables</text>

  <!-- ═══ DATABRICKS COLUMN ═══ -->
